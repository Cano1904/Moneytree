<title>Short Legs</title>
<meta name="description" content="SHORT LEGS – Detektiv-Spiel im Browser: Jede aufgedeckte Lüge kostet 25 % Bein.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One committed look: a dark noir game UI over the canvas. */
  :root {
    color-scheme: dark;
    --bg: #0a0b0d;
    --panel: #111418;
    --panel-2: #181c21;
    --line: #2b3239;
    --ink: #f3f5f7;
    --muted: #97a2ab;
    --lie: #ff2d55;
    --warm: #ff9a3c;
    --snow: #c9dce4;
    --ok: #7fd49a;
    --display: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --noir: "DM Serif Display", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sub-size: 22px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--display); overflow: hidden; user-select: none; -webkit-user-select: none; }
  * { box-sizing: border-box; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #07080a; touch-action: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: var(--lie); opacity: 0; transition: opacity .5s ease-out; mix-blend-mode: screen; }
  #flash.on { opacity: .42; transition: none; }
  #flash.border { background: none; box-shadow: inset 0 0 0 10px var(--lie); mix-blend-mode: normal; }
  #flash.border.on { opacity: 1; }

  /* ── Screens (menu & sub-menus) ── */
  .scr { position: fixed; inset: 0; overflow-y: auto; padding-inline: 16px; }
  #scr-menu { display: grid; grid-template-rows: auto 1fr auto; padding-block: clamp(24px, 7vh, 72px) 20px; padding-inline: clamp(16px, 6vw, 72px); }
  .logo { font: 400 clamp(52px, 11vw, 120px)/.86 var(--noir); letter-spacing: .01em; margin: 0; text-shadow: 0 0 26px rgba(255,45,85,.55), 0 5px 0 rgba(255,45,85,.4); }
  .logo .legs { display: inline-block; transform-origin: 50% 0; transition: transform .4s cubic-bezier(.34,1.8,.64,1); }
  .proverb { margin: 14px 0 0; color: var(--muted); font: 500 13px/1.4 var(--mono); letter-spacing: .06em; }
  .nav { align-self: center; display: grid; gap: clamp(6px, 1.6vh, 14px); justify-items: start; margin-top: 24px; }
  .nav button { background: none; border: 0; padding: 4px 0; font: 700 clamp(15px, 2.4vw, 20px)/1.2 var(--mono); letter-spacing: .08em; color: #b9c2c9; text-align: left; transition: transform .15s, color .15s; }
  .nav button::before { content: "▸ "; color: var(--lie); opacity: 0; }
  .nav button:hover, .nav button:focus-visible { color: #fff; transform: translateX(12px); outline: none; }
  .nav button:hover::before, .nav button:focus-visible::before { opacity: 1; }
  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: #6b757d; font: 500 12px/1.4 var(--mono); }

  .panel { background: rgba(8,9,11,.82); backdrop-filter: blur(3px); }
  .sheet { max-width: 760px; margin: 0 auto; padding-block: 40px 60px; display: grid; gap: 22px; }
  .sheet h2 { margin: 0; font: 400 clamp(32px, 6vw, 48px)/1 var(--noir); }
  .sheet h3 { margin: 0 0 4px; font: 700 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .note { color: var(--muted); max-width: 62ch; margin: 0; }
  .group { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: center; }
  .row label, .row .lbl { color: #d5dbe0; }
  .row small { color: var(--muted); }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; gap: 6px; } }
  input[type=range] { width: 100%; accent-color: var(--lie); }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; color: #c9d1d7; }
  .seg button[aria-pressed="true"] { border-color: var(--lie); color: #fff; background: #2a1419; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 16px; font-weight: 700; letter-spacing: .04em; }
  .btn:hover { border-color: #56616b; }
  .btn.primary { background: var(--lie); border-color: var(--lie); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  table.keys { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.keys td { padding: 6px 4px; border-top: 1px solid var(--line); }
  table.keys td:first-child { font: 700 12px/1.4 var(--mono); color: #fff; white-space: nowrap; width: 38%; }
  .kbd { display: inline-block; border: 1px solid #4a535b; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; margin: 1px 2px; }

  /* ── HUD ── */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-bar { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .chip { background: rgba(8,9,11,.78); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 6px 10px; font: 700 13px/1.25 var(--mono); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .chip small { display: block; color: var(--muted); font-weight: 500; font-size: 10px; letter-spacing: .12em; }
  .hud-l, .hud-r { display: flex; gap: 8px; flex-wrap: wrap; }
  .hud-r { justify-content: flex-end; }
  #legs { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #legs .bar { display: flex; gap: 3px; margin-top: 4px; }
  #legs .bar i { width: 18px; height: 8px; border-radius: 2px; background: #fff; }
  #legs .bar i.off { background: #3a2229; }
  #prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); background: rgba(8,9,11,.85); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; font: 700 13px/1 var(--mono); }
  #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; width: min(92vw, 560px); }
  #toast div { background: rgba(8,9,11,.9); border-left: 3px solid var(--warm); padding: 8px 12px; border-radius: 4px; font-weight: 600; text-align: center; animation: toast 4.2s forwards; }
  #toast div.red { border-left-color: var(--lie); }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  #cluecard { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 24px)); background: #efe6d2; color: #2a2118; border-radius: 4px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); transform: rotate(-1.2deg); }
  #cluecard b { display: block; font: 400 20px/1.1 var(--noir); margin-bottom: 4px; }
  #cluecard p { margin: 0; font-size: 14px; }
  #cluecard .stamp { font: 700 11px/1 var(--mono); color: #8b806d; letter-spacing: .1em; }

  #subs { z-index: 6; position: fixed; left: 50%; bottom: calc(9% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 820px); text-align: center; pointer-events: none; }
  #subs span { display: inline; padding: 4px 10px; line-height: 1.55; font-size: var(--sub-size); font-weight: 600; background: rgba(0,0,0,.55); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #subs.hc span { background: rgba(0,0,0,.88); }
  #subs b { color: var(--warm); }

  /* ── Modals ── */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,.82)); z-index: 5; }
  .modal .box { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal.wide .box { width: min(860px, 100%); }
  .modal h2 { margin: 0; font: 400 clamp(26px, 5vw, 36px)/1.05 var(--noir); text-wrap: balance; }
  .modal p { margin: 0; }
  .stack { display: grid; gap: 8px; }
  .stack .btn { text-align: left; font-family: var(--mono); }

  .dlg { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 560px) { .dlg { grid-template-columns: 1fr; } .dlg canvas { justify-self: center; } }
  .dlg canvas { width: 180px; height: 220px; background: radial-gradient(circle at 50% 30%, #4a3526, #17120f); border-radius: 8px; }
  .profile { font: 500 12px/1.6 var(--mono); color: var(--muted); }
  .lines { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .lines li { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .lines li.x { border-left: 3px solid var(--lie); }
  .lines li.x::after { content: " ✗"; color: var(--lie); font-weight: 800; }
  .lines li.fr { border-left-color: var(--warm); }
  .wheel { display: grid; gap: 8px; }
  .ring { display: grid; grid-template-columns: 90px 36px 1fr 36px; align-items: center; gap: 6px; }
  .ring .k { font: 700 11px/1.2 var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .ring .v { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 38px; font-size: 14px; }
  .ring button { height: 36px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
  .preview { font: 400 20px/1.25 var(--noir); color: #fff; }

  .nb { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .nb { grid-template-columns: 1fr; } }
  .nb section { display: grid; gap: 8px; align-content: start; }
  .nb ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .nb li { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .nb li small { display: block; color: var(--muted); }
  .nb .tag { font: 700 10px/1 var(--mono); letter-spacing: .08em; padding: 3px 5px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .tag.x { background: #3a1520; color: var(--lie); }
  .tag.open { background: #1f262d; color: var(--muted); }
  .tag.fake { background: #3a2a14; color: var(--warm); }
  .legrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
  .legrow .bar { display: flex; gap: 2px; }
  .legrow .bar i { width: 14px; height: 8px; border-radius: 2px; background: #e9eef1; }
  .legrow .bar i.off { background: #3a2229; }
  .legrow small { color: var(--muted); font: 500 11px/1 var(--mono); }
  .replay li { font-size: 14px; }

  .hats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .hat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; justify-items: center; text-align: center; font-size: 14px; }
  .hat canvas { width: 96px; height: 96px; }
  .hat.locked { opacity: .45; }

  /* ── Touch controls ── */
  #touch { position: fixed; inset: auto 0 0 0; height: 45%; pointer-events: none; }
  #stick { position: absolute; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); pointer-events: auto; touch-action: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #tbtns { position: absolute; right: 16px; bottom: calc(36px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; pointer-events: auto; }
  #tbtns button { height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.4); font: 700 12px/1 var(--mono); touch-action: manipulation; }
  #tbtns button.on { border-color: var(--warm); color: var(--warm); }
  #tbtns .e { background: rgba(255,45,85,.35); }

  @media (prefers-reduced-motion: reduce) { .logo .legs, .nav button { transition: none; } #toast div { animation-duration: .01s; animation-fill-mode: forwards; opacity: 1; } }
</style>

<canvas id="cv" aria-label="Spielwelt"></canvas>
<div id="flash"></div>

<div id="hud" hidden>
  <div class="hud-bar">
    <div class="hud-l" id="hudL"></div>
    <div class="hud-r" id="hudR"></div>
  </div>
  <div id="legs" class="chip"></div>
  <div id="prompt" hidden></div>
  <div id="toast" aria-live="polite"></div>
  <div id="cluecard" hidden></div>
</div>
<div id="subs" aria-live="polite" hidden></div>

<section class="scr" id="scr-menu">
  <header>
    <h1 class="logo">SHORT<br><span class="legs" id="logoLegs">LEGS</span></h1>
    <p class="proverb">„Lügen haben kurze Beine.“</p>
  </header>
  <nav class="nav" id="mainNav"></nav>
  <div class="foot"><span id="footL"></span><span>v1.0 · web</span></div>
</section>
<section class="scr panel" id="scr-lobby" hidden></section>
<section class="scr panel" id="scr-settings" hidden></section>
<section class="scr panel" id="scr-archive" hidden></section>

<div class="modal" id="m-quit" hidden><div class="box" id="quitBox"></div></div>
<div class="modal" id="m-pause" hidden><div class="box" id="pauseBox"></div></div>
<div class="modal wide" id="m-notebook" hidden><div class="box" id="nbBox"></div></div>
<div class="modal" id="m-dialog" hidden><div class="box" id="dlgBox"></div></div>
<div class="modal" id="m-wheel" hidden><div class="box" id="wheelBox"></div></div>
<div class="modal" id="m-vote" hidden><div class="box" id="voteBox"></div></div>
<div class="modal" id="m-card" hidden><div class="box" id="cardBox"></div></div>
<div class="modal wide" id="m-end" hidden><div class="box" id="endBox"></div></div>

<div id="touch" hidden>
  <div id="stick"><i></i></div>
  <div id="tbtns">
    <button data-k="sprint">RUN</button>
    <button data-k="jump">JUMP</button>
    <button data-k="use" class="e">E</button>
    <button data-k="note">TAB</button>
    <button data-k="meet">M</button>
    <button data-k="pause">II</button>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
