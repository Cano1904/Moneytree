<?xml version="1.0" encoding="UTF-8"?>
<!-- RE:PLANET – Konzeptkunst 03: die vier Planeten. Handgeschriebenes SVG, keine Spielszene. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>KONZEPTKUNST – keine Spielszene: TERRA, PYRA, PELAGIA, NIVALIS</title>
  <defs>
    <radialGradient id="space" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1C2448"/>
      <stop offset="0.6" stop-color="#0D1128"/>
      <stop offset="1" stop-color="#05060F"/>
    </radialGradient>
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E4FA8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8E4FA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2FA7C4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2FA7C4" stop-opacity="0"/>
    </radialGradient>
    <!-- Beleuchtung: Licht von links oben -->
    <radialGradient id="shade" cx="0.32" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="terraBase" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#C9B98E"/>
      <stop offset="1" stop-color="#6F6A58"/>
    </radialGradient>
    <radialGradient id="pyraBase" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#E07A4E"/>
      <stop offset="1" stop-color="#7E3321"/>
    </radialGradient>
    <radialGradient id="pelBase" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#58C8E0"/>
      <stop offset="1" stop-color="#1B5E86"/>
    </radialGradient>
    <radialGradient id="nivBase" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#F4FAFF"/>
      <stop offset="1" stop-color="#8FA9C8"/>
    </radialGradient>
    <radialGradient id="atmoT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#F3C98B" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#F3C98B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3C98B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmoP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#F0A56B" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#F0A56B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F0A56B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmoL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#BFE9F0" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#BFE9F0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#BFE9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmoN" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#7DF9FF" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#7DF9FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cT"><circle cx="0" cy="0" r="150"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="aur" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9BFFB8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7DF9FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#B07DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C8FFD8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4C08A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4C08A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>
  <ellipse cx="300" cy="260" rx="420" ry="220" fill="url(#neb1)"/>
  <ellipse cx="1320" cy="640" rx="460" ry="240" fill="url(#neb2)"/>
  <!-- Sterne -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="120" r="1.4" opacity="0.8"/><circle cx="210" cy="90" r="1" opacity="0.6"/><circle cx="330" cy="150" r="1.6" opacity="0.9"/>
    <circle cx="460" cy="96" r="1.1" opacity="0.7"/><circle cx="590" cy="134" r="1.3" opacity="0.8"/><circle cx="720" cy="88" r="1" opacity="0.5"/>
    <circle cx="860" cy="120" r="1.5" opacity="0.8"/><circle cx="990" cy="98" r="1.1" opacity="0.6"/><circle cx="1120" cy="140" r="1.4" opacity="0.9"/>
    <circle cx="1250" cy="96" r="1" opacity="0.6"/><circle cx="1380" cy="128" r="1.6" opacity="0.8"/><circle cx="1510" cy="92" r="1.2" opacity="0.7"/>
    <circle cx="60" cy="640" r="1.2" opacity="0.7"/><circle cx="150" cy="780" r="1.5" opacity="0.8"/><circle cx="420" cy="820" r="1" opacity="0.6"/>
    <circle cx="700" cy="790" r="1.3" opacity="0.7"/><circle cx="930" cy="840" r="1.1" opacity="0.6"/><circle cx="1180" cy="800" r="1.5" opacity="0.8"/>
    <circle cx="1450" cy="830" r="1.2" opacity="0.7"/><circle cx="1560" cy="700" r="1" opacity="0.5"/><circle cx="780" cy="440" r="1" opacity="0.5"/>
    <circle cx="20" cy="380" r="1.1" opacity="0.6"/><circle cx="1585" cy="400" r="1.3" opacity="0.7"/><circle cx="560" cy="470" r="0.9" opacity="0.5"/>
    <circle cx="1020" cy="470" r="0.9" opacity="0.5"/><circle cx="1260" cy="300" r="1" opacity="0.6"/><circle cx="360" cy="560" r="1" opacity="0.5"/>
  </g>

  <!-- Transportschiff-Route (gestrichelt) -->
  <path d="M200 430 C 420 330, 560 330, 590 430 S 900 540, 1010 430 S 1260 330, 1400 430" stroke="#FFB347" stroke-width="2.5" stroke-dasharray="4 12" fill="none" opacity="0.55"/>

  <!-- ===== TERRA ===== -->
  <g transform="translate(205,430)">
    <circle r="168" fill="url(#atmoT)"/>
    <circle r="150" fill="url(#terraBase)"/>
    <g clip-path="url(#cT)">
      <!-- grüne Parkinseln und Stadtflecken -->
      <path d="M-120 -40 q40 -40 90 -20 q30 30 -10 60 q-60 20 -80 -40z" fill="#6F7F4F"/>
      <path d="M20 40 q50 -20 90 10 q10 40 -40 50 q-50 -10 -50 -60z" fill="#6F7F4F" opacity="0.9"/>
      <g fill="#5E5A4E" opacity="0.8">
        <rect x="-30" y="-110" width="10" height="16"/><rect x="-14" y="-118" width="8" height="24"/><rect x="0" y="-106" width="12" height="12"/>
        <rect x="40" y="-60" width="10" height="20"/><rect x="56" y="-52" width="8" height="12"/>
        <rect x="-80" y="60" width="12" height="18"/><rect x="-62" y="66" width="8" height="12"/>
      </g>
      <!-- Müllberge -->
      <g fill="#8A5A44" opacity="0.75">
        <ellipse cx="-40" cy="10" rx="30" ry="10"/><ellipse cx="60" cy="-10" rx="22" ry="8"/><ellipse cx="-10" cy="100" rx="26" ry="8"/>
      </g>
      <ellipse cx="0" cy="-20" rx="170" ry="26" fill="#FFE2B0" opacity="0.18" transform="rotate(-18)"/>
    </g>
    <circle r="150" fill="url(#shade)"/>
  </g>

  <!-- ===== PYRA ===== -->
  <g transform="translate(600,430)">
    <circle r="168" fill="url(#atmoP)"/>
    <circle r="150" fill="url(#pyraBase)"/>
    <g clip-path="url(#cT)">
      <!-- Dünenbänder -->
      <g fill="none" stroke="#F0A56B" stroke-width="7" opacity="0.45">
        <path d="M-160 -60 Q-80 -80 0 -60 T160 -70"/>
        <path d="M-160 0 Q-80 -20 0 0 T160 -10"/>
        <path d="M-160 60 Q-80 40 0 60 T160 50"/>
        <path d="M-160 110 Q-80 90 0 110 T160 100"/>
      </g>
      <!-- Schrottschluchten -->
      <path d="M-60 -130 L-40 -60 L-70 10 L-30 80" stroke="#5C2418" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M50 -30 L80 30 L60 90" stroke="#5C2418" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Fabriken -->
      <g fill="#4A2A22">
        <rect x="10" y="-100" width="30" height="16"/><rect x="18" y="-120" width="6" height="20"/><rect x="30" y="-116" width="5" height="16"/>
        <rect x="-110" y="30" width="26" height="14"/><rect x="-102" y="16" width="5" height="14"/>
      </g>
      <!-- Sandsturm -->
      <ellipse cx="80" cy="40" rx="80" ry="46" fill="url(#dust)"/>
    </g>
    <circle r="150" fill="url(#shade)"/>
  </g>

  <!-- ===== PELAGIA ===== -->
  <g transform="translate(1000,430)">
    <circle r="168" fill="url(#atmoL)"/>
    <circle r="150" fill="url(#pelBase)"/>
    <g clip-path="url(#cT)">
      <!-- Lagunen und Inseln -->
      <g fill="#2FD1C5" opacity="0.5">
        <ellipse cx="-50" cy="-40" rx="46" ry="26"/><ellipse cx="60" cy="50" rx="40" ry="22"/><ellipse cx="-20" cy="90" rx="30" ry="14"/>
      </g>
      <g fill="#D8C9A0">
        <ellipse cx="-50" cy="-40" rx="20" ry="11"/><ellipse cx="60" cy="50" rx="16" ry="9"/><ellipse cx="-20" cy="90" rx="10" ry="6"/><ellipse cx="80" cy="-70" rx="9" ry="5"/>
      </g>
      <g fill="#6FA65A"><ellipse cx="-54" cy="-42" rx="9" ry="5"/><ellipse cx="58" cy="48" rx="7" ry="4"/></g>
      <!-- schwimmende Müllinseln -->
      <g fill="#E6E1D3" opacity="0.8">
        <circle cx="10" cy="-10" r="4"/><circle cx="18" cy="-6" r="3"/><circle cx="6" cy="-2" r="3"/><circle cx="24" cy="0" r="2.5"/>
        <circle cx="-90" cy="40" r="3"/><circle cx="-84" cy="46" r="2.5"/>
      </g>
      <!-- Ölfleck -->
      <ellipse cx="100" cy="-10" rx="20" ry="9" fill="#151515" opacity="0.55"/>
      <!-- Wolkenwirbel -->
      <g fill="#FFFFFF" opacity="0.35">
        <ellipse cx="-80" cy="-100" rx="60" ry="10" transform="rotate(-12 -80 -100)"/>
        <ellipse cx="60" cy="110" rx="70" ry="9" transform="rotate(-10 60 110)"/>
      </g>
    </g>
    <circle r="150" fill="url(#shade)"/>
  </g>

  <!-- ===== NIVALIS ===== -->
  <g transform="translate(1395,430)">
    <!-- Polarlicht -->
    <path d="M-175 -125 Q-90 -190 -10 -150 Q70 -215 175 -135 Q150 -160 150 -190 Q70 -300 -10 -250 Q-90 -290 -150 -190 Q-150 -160 -175 -125 Z" fill="url(#aur)"/>
    <path d="M-135 -145 Q-50 -200 30 -160 Q90 -200 140 -150 Q120 -175 115 -195 Q90 -250 30 -220 Q-50 -250 -110 -190 Q-115 -170 -135 -145 Z" fill="url(#aur2)"/>
    <circle r="168" fill="url(#atmoN)"/>
    <circle r="150" fill="url(#nivBase)"/>
    <g clip-path="url(#cT)">
      <!-- Eisschollen / Risse -->
      <g stroke="#9DB8D6" stroke-width="3" fill="none" opacity="0.8">
        <path d="M-140 -20 L-60 -40 L-10 -10 L60 -30 L150 0"/>
        <path d="M-60 -40 L-80 -110"/>
        <path d="M-10 -10 L10 70 L-40 130"/>
        <path d="M60 -30 L90 -110"/>
        <path d="M10 70 L100 80"/>
      </g>
      <!-- Kuppeln und Raumhafen -->
      <g fill="#3C6E9E" opacity="0.8">
        <path d="M-70 40 a14 14 0 0 1 28 0z"/><path d="M-40 46 a10 10 0 0 1 20 0z"/>
        <rect x="50" y="20" width="30" height="6"/><rect x="62" y="0" width="6" height="20"/>
      </g>
      <circle cx="-56" cy="34" r="3" fill="#7DF9FF"/>
      <ellipse cx="0" cy="-90" rx="140" ry="14" fill="#FFFFFF" opacity="0.3"/>
    </g>
    <circle r="150" fill="url(#shade)"/>
  </g>

  <!-- Beschriftungen -->
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(205,640)">
      <text font-size="34" font-weight="bold" fill="#FFB347" letter-spacing="3">TERRA</text>
      <text y="30" font-size="17" fill="#E8E2D6">Die vergessene Erde</text>
      <text y="58" font-size="14" fill="#AEB5C8">Hochhäuser · Einkaufsstraßen · Parks</text>
      <text y="80" font-size="14" fill="#AEB5C8">Staubsturm · Unterstand</text>
      <rect x="-62" y="96" width="124" height="26" rx="13" fill="#2A3350" stroke="#FFB347"/>
      <text y="114" font-size="13" fill="#FFB347">Startplanet</text>
    </g>
    <g transform="translate(600,640)">
      <text font-size="34" font-weight="bold" fill="#FF7A3D" letter-spacing="3">PYRA</text>
      <text y="30" font-size="17" fill="#E8E2D6">Die rostrote Industriewelt</text>
      <text y="58" font-size="14" fill="#AEB5C8">Fabriken · Schrottschluchten · Wüste</text>
      <text y="80" font-size="14" fill="#AEB5C8">Sandsturm verschiebt die Dünen</text>
      <rect x="-62" y="96" width="124" height="26" rx="13" fill="#2A3350" stroke="#FF7A3D"/>
      <text y="114" font-size="13" fill="#FF7A3D">Startplanet</text>
    </g>
    <g transform="translate(1000,640)">
      <text font-size="34" font-weight="bold" fill="#2FD1C5" letter-spacing="3">PELAGIA</text>
      <text y="30" font-size="17" fill="#E8E2D6">Der vermüllte Ozeanplanet</text>
      <text y="58" font-size="14" fill="#AEB5C8">Lagunen · Inselstädte · Müllinseln</text>
      <text y="80" font-size="14" fill="#AEB5C8">Schwimmen, Tauchen, Ölteppiche</text>
      <rect x="-62" y="96" width="124" height="26" rx="13" fill="#2A3350" stroke="#2FD1C5"/>
      <text y="114" font-size="13" fill="#2FD1C5">Startplanet</text>
    </g>
    <g transform="translate(1395,640)">
      <text font-size="34" font-weight="bold" fill="#7DF9FF" letter-spacing="3">NIVALIS</text>
      <text y="30" font-size="17" fill="#E8E2D6">Die eingefrorene Zukunft</text>
      <text y="58" font-size="14" fill="#AEB5C8">Forschungskuppeln · Raumhafen</text>
      <text y="80" font-size="14" fill="#AEB5C8">Kälte, Eis, Polarlicht</text>
      <rect x="-62" y="96" width="124" height="26" rx="13" fill="#3A2A50" stroke="#7DF9FF"/>
      <text y="114" font-size="13" fill="#7DF9FF">Finale</text>
    </g>
  </g>
  <text x="800" y="840" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#AEB5C8">Drei Startplaneten frei wählbar · NIVALIS öffnet sich nach den drei Großprojekten und dem Sprungantrieb</text>

  <!-- Kopfzeile -->
  <rect x="0" y="0" width="1600" height="58" fill="#000000" opacity="0.45"/>
  <text x="32" y="38" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">RE:PLANET · 03 · Die vier Planeten</text>
  <rect x="1060" y="12" width="512" height="34" rx="6" fill="#FF8C2E"/>
  <text x="1316" y="36" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A1206">KONZEPTKUNST – keine Spielszene</text>
</svg>
